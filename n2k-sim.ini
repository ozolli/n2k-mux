# n2k-sim.ini — config d'arbitrage assortie au simulateur ./n2k-sim
#
#   make n2k-sim n2k-mux
#   ./n2k-sim | ./n2k-mux n2k-sim.ini -v          # instruments → phrases 0183
#   ./n2k-sim | ./n2k-mux --ais-json n2k-sim.ini  # AIS → dédup par MMSI
#
# Les identités ci-dessous sont les Model Serial Code émis par n2k-sim (PGN
# 126996) : l'arbitrage résout src→identité→nom grâce à elles.

[output]
talker = II

[sources]
SCX    = SCX20-SIM      ; Furuno SCX-20 simulé  (src 4)
VER    = 917661         ; Veratron GO simulé    (src 2)
MAD    = MAD-SIM        ; MADBrain simulé       (src 5)
DST_BB = DSTBB-SIM      ; DST810 bâbord simulé  (src 20)
DST_TB = DSTTB-SIM      ; DST810 tribord simulé (src 21)
AIS    = EMTRAK-SIM     ; em-trak B953 simulé   (src 30)
DH     = DH-SIM         ; DataHub simulé        (src 31)

[priority]
129025          = SCX, VER, MAD        ; GLL
129026          = SCX, VER, MAD        ; VTG
129029          = SCX, VER             ; GGA
129539          = SCX, VER             ; GSA
129540          = SCX, VER             ; GSV
126992          = SCX, VER, MAD        ; ZDA
127250/Magnetic = SCX, MAD             ; HDG + HDM
127250/True     = SCX, MAD             ; HDT
127251          = SCX, MAD             ; ROT
127257          = SCX, MAD             ; XDR (pitch/roll)
130306/Apparent = MAD                  ; MWV(R)
130306/True     = MAD                  ; MWV(T) + MWD
127245          = MAD                  ; RSA
129291          = MAD                  ; VDR
128259          = MAD                  ; VHW
128275          = max: DST_BB, DST_TB  ; VLW (loch : max = capteur le plus avancé)
128267          = min: DST_BB, DST_TB  ; DPT (minimum)
130316/Sea      = DST_BB, DST_TB       ; MTW (eau)  [130312 déprécié]
130316/Outside  = SCX                  ; MDA (air)
130314          = SCX                  ; MDA (pression)

129038 = fusion: AIS, DH
129039 = fusion: AIS, DH
129040 = fusion: AIS, DH
129041 = fusion: AIS, DH
129793 = fusion: AIS, DH
129794 = fusion: AIS, DH
129809 = fusion: AIS, DH
129810 = fusion: AIS, DH

[ignore]
src = 0
pgn = 262161, 262656

[rate]
GLL = 1000
VTG = 1000
HDG = 500
GSV = 5000
XDR = 1000

# kplex-sim.conf — kplex pour le banc simulé (n2k-sim-run).
# Identique à la prod mais SANS le log fichier ni l'UDP broadcast : juste la
# fusion instruments (stdin) + AIS (n2kd TCP 2599) → serveur TCP 10110 pour qtVlm.

[global]
mode=foreground

# Instruments NMEA 0183 produits par n2k-mux (stdin du pipeline).
[file]
direction=in
filename=-

# AIS (VDM) encodé par n2kd, dédupliqué par MMSI (n2k-mux --ais-json).
[tcp]
direction=in
mode=client
address=127.0.0.1
port=2599
persist=fromstart
retry=5

# Sortie fusionnée pour qtVlm.
[tcp]
mode=server
port=10110
direction=out
